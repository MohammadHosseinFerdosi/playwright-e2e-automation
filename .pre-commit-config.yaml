# Install once: pip install -e ".[dev]" && pre-commit install
# Run on demand: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Match local/dev ruff (0.16.x) so pre-commit and `make lint` agree on rules.
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.gitlab-ci\.yml$  # GitLab-flavored YAML anchors can trip the generic parser
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright (scripts+tests typecheck)
        entry: basedpyright --level error scripts tests
        language: python
        additional_dependencies: ["basedpyright>=1.18"]
        pass_filenames: false
        types: [python]
      - id: step-style
        name: thin-step contract (tests/bdd/steps)
        entry: python3 scripts/check_step_style.py
        language: system
        files: ^(tests/bdd/steps/.*\.py|scripts/check_step_style\.py)$
        pass_filenames: false
      - id: no-real-secrets
        name: block committing real secrets files
        entry: bash -c 'git diff --cached --name-only | grep -E "^secrets/.*\.(yaml|env)$" | grep -vE "\.example\.(yaml|env)$" && echo "Refusing to commit real secrets/ files -- only *.example.* is allowed." && exit 1 || exit 0'
        language: system
        pass_filenames: false
