$kind: http-request
description: |-
  Returns configs[].inquiryDistributions + totalInquiryDistributions.
  Note: totalInquiryDistributions = copy of configs[0] distributions (not a sum).
url: "{{baseUrl}}/admin/bills/configs"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      pm.test('SUCCESS', () => pm.expect(j.result.title).to.eql('SUCCESS'));
      pm.test('has configs', () => pm.expect(j.configs).to.be.an('array').that.is.not.empty);
      pm.test('each config has distributions', () => {
        j.configs.forEach(c => {
          pm.expect(c.type).to.be.a('number');
          pm.expect(c.inquiryDistributions).to.be.an('array').that.is.not.empty;
          c.inquiryDistributions.forEach(d => {
            pm.expect([0,1,2]).to.include(d.provider);
            pm.expect(d.weight).to.be.at.least(0);
          });
        });
      });
      if (j.totalInquiryDistributions) {
        console.log('totalInquiryDistributions', JSON.stringify(j.totalInquiryDistributions));
      }
      console.log('sample type', j.configs[0].type, JSON.stringify(j.configs[0].inquiryDistributions));
order: 1000
