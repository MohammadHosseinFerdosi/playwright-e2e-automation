# Copy to secrets/uat_telephone_bills.yaml (gitignored) and fill real values.
# Never commit real phones, bill IDs, or TCI passwords.
#
# inquiry_id  = Platform app / validate style (WITH leading 0), e.g. 02144443604
# tel_number  = TCI upstream style (WITHOUT leading 0), e.g. 2144443604
#               (only needed for tci_provider_inquiry.feature)
#
# Platform validate pool keys (POST /bills/validate, payMethod=3, type=7):
#   both_terms_debt        — mid + final both have debt (e.g. 02144443604)
#   mid_only_debt          — final paid, mid still has debt (e.g. 02177165824)
#   both_terms_debt_region — other region, both terms debt (e.g. 05138219654)
#   no_debt                — both mid+final بدون بدهی (UI rows is-disabled)
#   invalid_phone          — unsupported / telStatus 2 style
#   province_blocked       — province not allowed

tci:
  base_url: "https://bill.demo-platform.com/tci/"
  code: "Platform"
  password: "CHANGE_ME"

cases:
  both_terms_debt:
    mode: both_terms_debt
    inquiry_id: "02144443604"
    tel_number: "2144443604"
    notes: "UAT — mid + final debt; Platform merges into billInfos[]"

  mid_only_debt:
    mode: mid_only_debt
    inquiry_id: "02177165824"
    tel_number: "2177165824"
    notes: "UAT — final paid, mid has debt"

  both_terms_debt_region:
    mode: both_terms_debt_region
    inquiry_id: "05138219654"
    tel_number: "5138219654"
    notes: "UAT — other region, both terms debt"

  no_debt:
    mode: no_debt
    inquiry_id: "02122137948"
    tel_number: "2122137948"
    expected_tel_status: 4

  # invalid_phone:
  #   mode: invalid
  #   inquiry_id: "02112"
